<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>25 Minute Writing Practice</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FFEBA1;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 1000px;
            width: 100%;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 30px;
            color:  black;
        }

        h2 {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #555;
        }

        .btn {
            background: #FFD100;
            color: black;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 1.1em;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #eee;
        }

        th {
            background: #f8f9fa;
            font-weight: bold;
            color: black;
            width: 40%;
        }

        td {
            background: #fff;
            color: #555;
            font-weight: 500;
        }

        .timer-display {
            font-size: 4em;
            font-weight: bold;
            color: black;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
        }

        .timer-subtitle {
            font-size: 1.2em;
            color: #888;
            margin-bottom: 30px;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn-reset {
            background: white;
            color: #FFD100;
            border: 2px solid #FFD100;
        }

        .btn-reset:hover {
            background: #FFD100;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Homepage -->
    <div id="homepage" class="page active">
        <div class="container">
            <h1>Are you ready to write?</h1>
            <button class="btn" onclick="goToGenerator()">Start!</button>
        </div>
    </div>

    <!-- Generator Page -->
    <div id="generator" class="page">
        <div class="container">
            <h2>Your Story Prompt</h2>
            <table>
                <tr>
                    <th>Genre</th>
                    <td id="genre"></td>
                </tr>
                <tr>
                    <th>Character Personality</th>
                    <td id="personality"></td>
                </tr>
                <tr>
                    <th>Character Age</th>
                    <td id="age"></td>
                </tr>
                <tr>
                    <th>Story Tone</th>
                    <td id="tone"></td>
                </tr>
                <tr>
                    <th>Plot Type</th>
                    <td id="plot"></td>
                </tr>
                <tr>
                    <th>Ending</th>
                    <td id="ending"></td>
                </tr>
            </table>
            <div class="btn-group">
                <button class="btn btn-reset" onclick="randomize()">Reset</button>
                <button class="btn" onclick="goToTimer()">Countdown</button>
            </div>
        </div>
    </div>

    <!-- Timer Page -->
    <div id="timer" class="page">
        <div class="container">
            <div class="timer-display" id="clock">25:00</div>
            <div class="timer-subtitle">25 minutes remaining</div>
            <button class="btn" onclick="goToHome()">Done!</button>
        </div>
    </div>

    <script>
        // Data pools for randomization
        const data = {
            genre: ['Fantasy', 'Sci-Fi', 'Romance', 'Mystery', 'Horror', 'Thriller', 'Historical', 'Comedy', 'Drama', 'Adventure', 'Non-Fiction', 'Action', 'Mythological', 'Urban', 'Spy', 'Supenatural', 'Isekai', 'Space Opera', 'Utopian', 'Distopian', 'Apocalyptic', 'Post-Apocalyptic'],
            personality: ['Optimistic', 'Pessimistic', 'Introverted', 'Extroverted', 'Cynical', 'Naive', 'Stoic', 'Impulsive', 'Methodical', 'Charismatic', 'Paranoid', 'Compassionate', 'Arrogant', 'Curious', 'Rebellious', 'Stubborn', 'Adventurous', 'Ambitious', 'Laid-Back', 'Skeptical', 'Trusting'],
            age: ['Child (5-12)', 'Teenager (13-19)', 'Young Adult (20-35)', 'Middle-aged (36-55)', 'Senior (56+)'],
            tone: ['Dark & Gritty', 'Light & Humorous', 'Melancholic', 'Inspirational', 'Suspenseful', 'Whimsical', 'Tragic', 'Hopeful', 'Dramatic'],
            plot: ['Quest and Journey', 'Love Story', 'Revenge', 'Redemption', 'Survival', 'Discover Secret', 'Transformation', 'Escape', 'Growth', 'Overcoming Monster', 'Rag to Rich', 'Voyage and Return'],
            ending: ['Happy Ending', 'Tragic Ending', 'Bittersweet', 'Open Ending', 'Twist Ending', 'Circular Ending', 'Cliffhanger']
        };

        let timerInterval;
        let timeRemaining = 25 * 60; // 25 minutes in seconds

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.getElementById(pageId).classList.add('active');
        }

        function randomize() {
            document.getElementById('genre').textContent = getRandom(data.genre);
            document.getElementById('personality').textContent = getRandom(data.personality);
            document.getElementById('age').textContent = getRandom(data.age);
            document.getElementById('tone').textContent = getRandom(data.tone);
            document.getElementById('plot').textContent = getRandom(data.plot);
            document.getElementById('ending').textContent = getRandom(data.ending);
        }

        function getRandom(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function goToGenerator() {
            randomize();
            showPage('generator');
        }

        function goToTimer() {
            showPage('timer');
            startTimer();
        }

        function goToHome() {
            clearInterval(timerInterval);
            timeRemaining = 25 * 60;
            document.getElementById('clock').textContent = '25:00';
            showPage('homepage');
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeRemaining = 25 * 60;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById('clock').textContent = '00:00';
                    document.querySelector('.timer-subtitle').textContent = "Time's up!";
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const minutes = Math.floor(timeRemaining / 60);
            const seconds = timeRemaining % 60;
            document.getElementById('clock').textContent = 
                String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            document.querySelector('.timer-subtitle').textContent = 
                minutes + ' minute' + (minutes !== 1 ? 's' : '') + ' remaining';
        }
    </script>
</body>
</html>
